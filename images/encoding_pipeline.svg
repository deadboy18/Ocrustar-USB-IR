<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#1a1f27"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="8" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="900" height="620" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold" letter-spacing="1">OCRUSTAR D226 — IR ENCODING PIPELINE</text>
  <line x1="180" y1="50" x2="720" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- ═══ INPUT BOX ═══ -->
  <rect x="280" y="66" width="340" height="48" rx="6" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="86" text-anchor="middle" fill="#8b949e" font-size="11">INPUT</text>
  <text x="450" y="102" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Raw IR Timings (µs)</text>
  <text x="688" y="95" text-anchor="start" fill="#484f58" font-size="10">[9000, 4500, 560, ...]</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="114" x2="450" y2="148" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ═══ STAGE 1: WAVZip ═══ -->
  <g filter="url(#shadow)">
    <rect x="120" y="150" width="660" height="82" rx="6" fill="url(#stageGrad)" stroke="#2d5a1e" stroke-width="1.5"/>
  </g>
  <rect x="120" y="150" width="660" height="4" rx="2" fill="#3fb950" opacity="0.7"/>
  <text x="142" y="176" fill="#3fb950" font-size="12" font-weight="bold">STAGE 1</text>
  <text x="218" y="176" fill="#e6edf3" font-size="12" font-weight="bold">Pulse Compression (WAVZip)</text>
  <text x="142" y="196" fill="#8b949e" font-size="10.5">▸ Count (mark,space) pair frequencies</text>
  <text x="142" y="211" fill="#8b949e" font-size="10.5">▸ Extract top-2 pairs → sort by duration (shorter=0x00, longer=0x01)</text>
  <text x="142" y="226" fill="#8b949e" font-size="10.5">▸ Emit dictionary header [pair1] [pair0] FF FF FF + encoded references</text>
  <text x="610" y="224" fill="#484f58" font-size="9">com.esmart.ir.otg.b</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="232" x2="450" y2="266" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <text x="462" y="254" fill="#484f58" font-size="9">values ÷ 16</text>

  <!-- ═══ STAGE 2: LEB128 ═══ -->
  <g filter="url(#shadow)">
    <rect x="120" y="268" width="660" height="72" rx="6" fill="url(#stageGrad)" stroke="#1a4a6e" stroke-width="1.5"/>
  </g>
  <rect x="120" y="268" width="660" height="4" rx="2" fill="#58a6ff" opacity="0.7"/>
  <text x="142" y="294" fill="#58a6ff" font-size="12" font-weight="bold">STAGE 2</text>
  <text x="218" y="294" fill="#e6edf3" font-size="12" font-weight="bold">LEB128 with ÷16 Prescaling</text>
  <text x="142" y="312" fill="#8b949e" font-size="10.5">▸ Each timing value: round(µs / 16) → variable-length LEB128 encode</text>
  <text x="142" y="327" fill="#8b949e" font-size="10.5">▸ 0xFF bytes escaped to 0xFE (collision with dictionary separator)</text>
  <text x="610" y="327" fill="#484f58" font-size="9">libelksmart.so</text>

  <!-- Arrow 3 -->
  <line x1="450" y1="340" x2="450" y2="374" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ═══ STAGE 3: Huffman ═══ -->
  <g filter="url(#shadow)">
    <rect x="120" y="376" width="660" height="82" rx="6" fill="url(#stageGrad)" stroke="#6e3a1a" stroke-width="1.5"/>
  </g>
  <rect x="120" y="376" width="660" height="4" rx="2" fill="#d29922" opacity="0.7"/>
  <text x="142" y="402" fill="#d29922" font-size="12" font-weight="bold">STAGE 3</text>
  <text x="218" y="402" fill="#e6edf3" font-size="12" font-weight="bold">Huffman Coding</text>
  <rect x="340" y="392" width="70" height="16" rx="3" fill="#6e3a1a" stroke="#d29922" stroke-width="0.5"/>
  <text x="375" y="403" text-anchor="middle" fill="#d29922" font-size="9" font-weight="bold">D226 ONLY</text>
  <text x="142" y="422" fill="#8b949e" font-size="10.5">▸ Build Huffman tree from byte frequencies (Java PriorityQueue order)</text>
  <text x="142" y="437" fill="#8b949e" font-size="10.5">▸ Serialize: [sym_count] [sym, freq]... [pad_bits] [bitstream]</text>
  <text x="142" y="452" fill="#8b949e" font-size="10.5">▸ Frequency table transmitted (not code lengths) — device rebuilds tree</text>
  <text x="610" y="452" fill="#484f58" font-size="9">b.a – b.f (HufMZip)</text>

  <!-- Arrow 4 -->
  <line x1="450" y1="458" x2="450" y2="492" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ═══ STAGE 4: Framing ═══ -->
  <g filter="url(#shadow)">
    <rect x="120" y="494" width="660" height="72" rx="6" fill="url(#stageGrad)" stroke="#5a1a6e" stroke-width="1.5"/>
  </g>
  <rect x="120" y="494" width="660" height="4" rx="2" fill="#bc8cff" opacity="0.7"/>
  <text x="142" y="520" fill="#bc8cff" font-size="12" font-weight="bold">STAGE 4</text>
  <text x="218" y="520" fill="#e6edf3" font-size="12" font-weight="bold">Framing + Checksum</text>
  <text x="142" y="538" fill="#8b949e" font-size="10.5">▸ Prepend: FF FF FF FF [freq×3 mangled] [len×2 mangled]</text>
  <text x="142" y="553" fill="#8b949e" font-size="10.5">▸ Split into 62-byte chunks + 1-byte checksum each (last chunk: no checksum)</text>
  <text x="610" y="553" fill="#484f58" font-size="9">mangle = ~reverse_bits()</text>

  <!-- Arrow 5 -->
  <line x1="450" y1="566" x2="450" y2="590" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- ═══ OUTPUT BOX ═══ -->
  <rect x="240" y="590" width="420" height="24" rx="4" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="607" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">USB Bulk Writes → EP 0x01 OUT (64B max, 2ms interval)</text>

  <!-- Side annotations -->
  <text x="18" y="200" fill="#30363d" font-size="42" font-weight="bold" opacity="0.4">1</text>
  <text x="18" y="318" fill="#30363d" font-size="42" font-weight="bold" opacity="0.4">2</text>
  <text x="18" y="436" fill="#30363d" font-size="42" font-weight="bold" opacity="0.4">3</text>
  <text x="18" y="548" fill="#30363d" font-size="42" font-weight="bold" opacity="0.4">4</text>

  <!-- D552 skip annotation -->
  <path d="M 95 290 C 60 290, 60 430, 95 430" fill="none" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="52" y="365" text-anchor="middle" fill="#d29922" font-size="9" opacity="0.7" transform="rotate(-90, 52, 365)">D552 skips →</text>
</svg>
